<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="積志駅への経路" />
  <meta name="theme-color" content="#0a2240" />
  <link rel="icon" href="data:," />
  <title>積志駅への経路</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0b0f1a; color: #c8d8e8; min-height: 100vh; min-height: 100dvh; font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
    header { padding: 20px 16px; background: linear-gradient(135deg, #0e3a5c, #0a2240); border-bottom: 1px solid #1a3a55; }
    h1 { font-size: 17px; font-weight: 700; color: #fff; }
    main { padding: 24px 16px; display: flex; flex-direction: column; gap: 16px; }
    button { width: 100%; min-height: 64px; border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; background: #0e3a5c; color: #fff; font-size: 18px; font-weight: 700; cursor: pointer; }
    button:active { background: #0a2240; }
    #msg { font-size: 13px; color: #6a94b8; text-align: center; min-height: 1.5em; }
  </style>
</head>
<body>
  <header><h1>積志駅への経路</h1></header>
  <main>
    <button id="to">現在地 → 積志駅</button>
    <button id="from">積志駅 → 現在地</button>
    <p id="msg"></p>
  </main>
  <script>
    var STATION = "積志駅 静岡県";
    var coords = null;
    var failed = false;
    var pending = false;
    var msgShown = false;
    var msgEl = document.getElementById("msg");

    function showMsg() {
      msgShown = true;
      msgEl.textContent = failed
        ? "位置情報が取れませんでした。マップ側で現在地を指定してください"
        : "位置情報を取得中です。マップ側で現在地を使います";
    }

    function fail() {
      pending = false;
      failed = true;
      coords = null;
      if (msgShown) showMsg();
    }

    function getPos() {
      if (pending) return;
      if (!navigator.geolocation) { failed = true; coords = null; return; }
      pending = true;
      navigator.geolocation.getCurrentPosition(function (p) {
        pending = false;
        failed = false;
        coords = p.coords.latitude + "," + p.coords.longitude;
        msgShown = false;
        msgEl.textContent = "";
      }, fail, { timeout: 10000, maximumAge: 60000 });
    }

    function buildUrl(toStation, pos) {
      var st = encodeURIComponent(STATION);
      var p = pos ? encodeURIComponent(pos) : "";
      var o = toStation ? p : st;
      var d = toStation ? st : p;
      var url = "https://www.google.com/maps/dir/?api=1";
      if (o) url += "&origin=" + o;
      if (d) url += "&destination=" + d;
      return url + "&travelmode=transit";
    }

    function go(toStation) {
      if (!coords) {
        showMsg();
        getPos();
      }
      window.open(buildUrl(toStation, coords), "_blank");
    }

    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible") getPos();
    });

    document.getElementById("to").onclick = function () { go(true); };
    document.getElementById("from").onclick = function () { go(false); };
    getPos();
  </script>
</body>
</html>
